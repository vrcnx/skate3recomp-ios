# The iOS/iPadOS app: a thin Xcode target around libskate3_ios.a, which CMake
# builds (presets ios-release / iossim-release; see ios/README.md). Generate
# the project with ios/build.sh, or `xcodegen generate --spec ios/project.yml`
# with SKATE3_IOS_TEAM set to your Apple development team ID.
name: Skate3
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Skate 3
    PRODUCT_BUNDLE_IDENTIFIER: ${SKATE3_IOS_BUNDLE_ID}
    MARKETING_VERSION: "2.0.2"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: ${SKATE3_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Skate3.entitlements
    ENABLE_BITCODE: NO
    # CMake's merged archive for each SDK.
    SKATE3_ARCHIVE[sdk=iphoneos*]: $(PROJECT_DIR)/../out/build/${SKATE3_IOS_DEVICE_PRESET}/ios/libskate3_ios.a
    SKATE3_ARCHIVE[sdk=iphonesimulator*]: $(PROJECT_DIR)/../out/build/iossim-release/ios/libskate3_ios.a
    OTHER_LDFLAGS: $(SKATE3_ARCHIVE) -lc++ -liconv
targets:
  Skate3:
    type: application
    platform: iOS
    scheme: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: main.m
      - path: Assets.xcassets
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Skate 3
        # Same navy as the icon and setup screen, instead of a white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Game Mode (iPadOS 18+): CPU/GPU priority and lower controller latency.
        LSApplicationCategoryType: public.app-category.games
        GCSupportsGameMode: true
        LSSupportsGameMode: true
        # The game install, saves, settings and logs live in Documents, which
        # the Files app shows as On My iPad > Skate 3.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Keep pointer input as touches: with indirect input events on, SDL
        # waits for GCMouse and taps from the simulator and trackpads never
        # reach the UI.
        UIApplicationSupportsIndirectInputEvents: false
        # Controllers.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CADisableMinimumFrameDurationOnPhone: true
